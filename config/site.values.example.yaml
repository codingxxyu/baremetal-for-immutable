# Pack 1.4.0 / ACP v4.4.1. Copy to site.values.local.yaml (gitignored).
# There is no renderer. Editing this file does nothing to the manifests.
# Search-replace the same <placeholder> strings in the YAML/JSON this file
# names, then kubectl apply. Do not commit passwords, kubeconfigs, ISOs, or
# registration URLs.
#
# Official OS matrix currently lists v4.4.0 only; 4.4.1 is a patch and
# reuses that component row:
#   https://docs.alauda.cn/immutable-infra/1.0/en/overview/os-support-matrix.html
#
# First delivery does NOT register Global workers. Do not fill a
# global.worker_* block — see global/worker/SKIP.md.

acp_version: v4.4.1
kubernetes_version: v1.35.6-acp.1
containerd: 2.2.6-3
coredns_image_tag: 1.14.3-v4.4.6
etcd_image_tag: v3.6.13-acp.0
pause: "3.10"
kube_ovn_chart: v4.4.6
architecture: linux/amd64
namespace: cpaas-system

# Tag shared by both images in the Bare Metal OS OCI archive.
# Fill after: ctr -n bare-metal-os images ls -q
os_image_tag: <os-image-tag>

# Customer Portal packages. Chart versions must come from the same ACP 4.4.1 payload.
core_package: installer-core-v4.4.1-hybrid.tar
kubeadm_provider_pack: cluster-api-provider-kubeadm.ALL.v1.0.14.tgz
baremetal_provider_pack: cluster-api-provider-baremetal.ALL.v1.0.0-beta.6.ge76cf8f8.tgz
kubeadm_provider_chart_version: v1.0.14
baremetal_provider_chart_version: v1.0.0-beta.6.ge76cf8f8
bare_metal_os_archive: <bare-metal-os-archive>.tar

bootstrap:
  # Site bootstrap node (traditional OS + KIND minialauda). Not the Global VIP.
  host_ip: 156.3.1.26
  local_registry: 127.0.0.1:11443          # packtool / ctr push from the bootstrap node
  bootstrap_registry: 172.18.0.1:11443     # AppRelease repoURL (Pods inside KIND)
  # First-apply Cluster annotation (NODE_REGISTRY_ADDRESS). Installer rewrites
  # Cluster to platform.registry_domain. Never 127.0.0.1 / 172.18.0.1.
  node_registry: 156.3.1.26:11443
  elemental_server: https://156.3.1.26:12443
  # This site already extracted Core Package so the installer tree is /root/installer
  # (official example uses /root/cpaas-install). KIND binaries live next to packtool.
  installer_core_extract: /root
  installer_dir: /root/installer
  packtool: /root/installer/res/amd64/packtool

platform:
  # Official PLATFORM_HOST: console / dex / elemental after handoff, and the
  # finished-Global registry front. This site that is the Global VIP 156.3.1.50
  # (6443 API + 80/443 console + 11443 registry). Bootstrap 156.3.1.26 is HOST_IP only.
  host: 156.3.1.50
  # Official REGISTRY_DOMAIN = PLATFORM_HOST:11443.
  registry_domain: 156.3.1.50:11443
  control_plane_vip: 156.3.1.50
  control_plane_port: 6443
  load_balancer_type: External   # or Internal
  vrid: "<unique-vrid>"          # Internal only; delete the field for External
  network_device: eth0
  ingress_class: global-alb2

network:
  cluster_cidr: 10.3.0.0/16
  service_cidr: 10.4.0.0/16          # not 10.4.0.0/14 — that covers 10.5/10.6
  kube_ovn_join_cidr: 100.64.0.0/16

ssh:
  authorized_key: <ssh-authorized-keys>

install:
  device: /dev/elemental-install-target
  cos_state_size_mib: 20480
  emulate_tpm: true
  emulated_tpm_seed: -1

global:
  cluster_name: global           # required literal. Do not change.
  control_plane_replicas: 3
  # First delivery: skip Global workers (no worker_replicas / worker_inventories).
  control_plane_inventories:
    - name: <global-machine-inventory-1>
      hostname: global-cp-1
      network_device: eth0
    - name: <global-machine-inventory-2>
      hostname: global-cp-2
      network_device: eth0
    - name: <global-machine-inventory-3>
      hostname: global-cp-3
      network_device: eth0

workload:
  cluster_name: hcs-workloadcluster   # must not be "global"
  control_plane_replicas: 3
  worker_replicas: 1
  load_balancer_type: External
  control_plane_vip: 156.3.1.95
  control_plane_port: 6443
  vrid: "<workload-vrid>"
  network_device: eth0
  cluster_cidr: 10.5.0.0/16
  service_cidr: 10.6.0.0/16
  kube_ovn_join_cidr: 100.65.0.0/16
  control_plane_inventories:
    - name: <workload-cp-inventory-1>
      hostname: hcs-workloadcluster-cp-1
      network_device: eth0
    - name: <workload-cp-inventory-2>
      hostname: hcs-workloadcluster-cp-2
      network_device: eth0
    - name: <workload-cp-inventory-3>
      hostname: hcs-workloadcluster-cp-3
      network_device: eth0
  worker_inventories:
    - name: <workload-worker-inventory-1>
      hostname: hcs-workloadcluster-worker-1
      network_device: eth0
