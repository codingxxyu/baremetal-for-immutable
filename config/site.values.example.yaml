# Site values for this delivery. Copy to site.values.local.yaml (gitignored).
# There is no renderer. Editing this file does nothing to the manifests.
# Search-replace the same <placeholder> strings in the YAML/JSON this file
# names, then kubectl apply. Do not commit passwords, kubeconfigs, ISOs, or
# registration URLs.
#
# Official matrix for ACP v4.4.0:
#   https://docs.alauda.cn/immutable-infra/1.0/en/overview/os-support-matrix.html

acp_version: v4.4.0
kubernetes_version: v1.35.6-acp.1
containerd: 2.2.6-3
coredns_image_tag: 1.14.3-v4.4.6
etcd_image_tag: v3.6.13-acp.0
pause: "3.10"
kube_ovn_chart: v4.4.6
architecture: linux/amd64
namespace: cpaas-system

# Tag shared by both images in the Bare Metal OS OCI archive.
# Fill after: ctr -n bare-metal-os images ls -q
os_image_tag: <os-image-tag>

# Customer Portal packages. Chart versions must come from the same ACP 4.4.0 payload.
core_package: installer-core-v4.4.0-hybrid.tar
kubeadm_provider_pack: cluster-api-provider-kubeadm.amd64.<kubeadm-provider-chart-version>.tgz
baremetal_provider_pack: cluster-api-provider-baremetal.amd64.<baremetal-provider-chart-version>.tgz
kubeadm_provider_chart_version: <kubeadm-provider-chart-version>
baremetal_provider_chart_version: <baremetal-provider-chart-version>
bare_metal_os_archive: <bare-metal-os-archive>.tar

bootstrap:
  host_ip: <bootstrap-host-ip>
  local_registry: 127.0.0.1:11443          # packtool / ctr push from the bootstrap node
  bootstrap_registry: 172.18.0.1:11443     # AppRelease repoURL (Pods inside KIND)
  node_registry: <bootstrap-host-ip>:11443 # Cluster cpaas.io/registry-address until installer rewrites it
  elemental_server: https://<bootstrap-host-ip>:12443
  installer_core_extract: /root/cpaas-install
  packtool: /root/cpaas-install/installer/res/amd64/packtool

platform:
  host: <platform-access-domain-or-vip>
  registry_domain: <platform-access-domain-or-vip>:11443
  control_plane_vip: <global-control-plane-vip>
  control_plane_port: 6443
  load_balancer_type: External   # or Internal
  vrid: "<unique-vrid>"          # Internal only; delete the field for External
  network_device: eth0
  ingress_class: global-alb2

network:
  cluster_cidr: 100.3.0.0/16
  service_cidr: 100.4.0.0/16
  kube_ovn_join_cidr: 100.5.0.0/16

ssh:
  authorized_key: <ssh-authorized-keys>

install:
  device: /dev/elemental-install-target
  cos_state_size_mib: 20480
  emulate_tpm: true
  emulated_tpm_seed: -1

global:
  cluster_name: global           # required literal. Do not change.
  control_plane_replicas: 3
  worker_replicas: 1
  control_plane_inventories:
    - name: <global-machine-inventory-1>
      hostname: global-cp-1
      network_device: eth0
    - name: <global-machine-inventory-2>
      hostname: global-cp-2
      network_device: eth0
    - name: <global-machine-inventory-3>
      hostname: global-cp-3
      network_device: eth0
  worker_inventories:
    - name: <global-worker-inventory-1>
      hostname: global-worker-1
      network_device: eth0

workload:
  cluster_name: <workload-cluster-name>   # must not be "global"
  control_plane_replicas: 3
  worker_replicas: 1
  load_balancer_type: External
  control_plane_vip: <workload-control-plane-vip>
  control_plane_port: 6443
  vrid: "<workload-vrid>"
  network_device: eth0
  cluster_cidr: 100.13.0.0/16
  service_cidr: 100.14.0.0/16
  kube_ovn_join_cidr: 100.15.0.0/16
  control_plane_inventories:
    - name: <workload-cp-inventory-1>
      hostname: <workload-cluster-name>-cp-1
      network_device: eth0
    - name: <workload-cp-inventory-2>
      hostname: <workload-cluster-name>-cp-2
      network_device: eth0
    - name: <workload-cp-inventory-3>
      hostname: <workload-cluster-name>-cp-3
      network_device: eth0
  worker_inventories:
    - name: <workload-worker-inventory-1>
      hostname: <workload-cluster-name>-worker-1
      network_device: eth0
