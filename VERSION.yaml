# Delivery-pack identity. Not rendered. Do not confuse with ACP / Kubernetes versions.
pack: baremetal-for-immutable
pack_version: "1.4.0"
released: "2026-10-16"
acp_version: v4.4.1
kubernetes_version: v1.35.6-acp.1
etcd_image_tag: v3.6.13-acp.0
coredns_image_tag: 1.14.3-v4.4.6
containerd: 2.2.6-3
pause: "3.10"
kube_ovn_chart: v4.4.6
namespace: cpaas-system
baseline:
  dr: false
  install: iso-first
  load_balancer: External
  global_workers_on_bootstrap: skip
# Official Global Step 4 YAML is a fragment. Manifests in this pack are the
# complete Bare Metal create-cluster objects.
official_step4: fragment-not-applyable
# Official OS matrix currently has a v4.4.0 row and no v4.4.1 row.
# ACP 4.4.1 (issued 2026-10-01) is a patch; baked-in component versions
# stay the v4.4.0 row until the matrix publishes a 4.4.1 line.
#   https://docs.alauda.cn/immutable-infra/1.0/en/overview/os-support-matrix.html
#   https://docs.alauda.io/container_platform/4.4/overview/release_notes.html
# Site: PLATFORM_HOST = HOST_IP = 156.3.1.26. installer rewrite of Cluster
# cpaas.io/registry-address is a no-op on the host string. BaremetalCluster
# is NOT in the official rewrite set. What must never appear after KIND is
# gone: 127.0.0.1:11443 and 172.18.0.1:11443.
registry_address:
  host: 156.3.1.26
  node_and_platform: 156.3.1.26:11443
  kind_loopback: 127.0.0.1:11443
  kind_incluster: 172.18.0.1:11443
  after_installer_baremetalcluster: leave-if-already-host-ip
control_plane_vip:
  global: 156.3.1.50
  workload: 156.3.1.95
core_package:
  installer_dir: /root/installer
  packtool: /root/installer/res/amd64/packtool
gates:
  seedimage: status.downloadURL-nonempty
  installer_json: POST-on-bootstrap-node-to-installer-pod-ip-8080
  packtool_auth: read-pack-push-help-first
  seedimage_pvc: default-StorageClass-20Gi
  registry_rewrite: not-loopback-not-kind-incluster
