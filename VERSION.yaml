# Delivery-pack identity. Not rendered. Do not confuse with ACP / Kubernetes versions.
pack: baremetal-for-immutable
pack_version: "1.5.0"
released: "2026-10-15"
acp_version: v4.4.1
kubernetes_version: v1.35.6-acp.1
etcd_image_tag: v3.6.13-acp.0
coredns_image_tag: 1.14.3-v4.4.6
containerd: 2.2.6-3
pause: "3.10"
kube_ovn_chart: v4.4.6
namespace: cpaas-system
baseline:
  dr: false
  install: iso-first
  load_balancer: External
  global_workers_on_bootstrap: skip
# Official Global Step 4 YAML is a fragment. Manifests in this pack are the
# complete Bare Metal create-cluster objects.
official_step4: fragment-not-applyable
# Official OS matrix currently has a v4.4.0 row and no v4.4.1 row.
# ACP 4.4.1 (issued 2026-10-01) is a patch; baked-in component versions
# stay the v4.4.0 row until the matrix publishes a 4.4.1 line.
#   https://docs.alauda.cn/immutable-infra/1.0/en/overview/os-support-matrix.html
#   https://docs.alauda.io/container_platform/4.4/overview/release_notes.html
# HOST_IP 156.3.1.26 = bootstrap. PLATFORM_HOST / REGISTRY_DOMAIN = 156.3.1.50
# (Global VIP: 6443 API + 80/443 console + 11443 registry). Installer rewrites
# Cluster cpaas.io/registry-address 156.3.1.26:11443 → 156.3.1.50:11443.
# BaremetalCluster is NOT in the rewrite set — patch after Success.
# Never 127.0.0.1:11443 or 172.18.0.1:11443 after KIND is gone.
registry_address:
  host_ip: 156.3.1.26
  node_first_apply: 156.3.1.26:11443
  platform_host: 156.3.1.50
  registry_domain: 156.3.1.50:11443
  kind_loopback: 127.0.0.1:11443
  kind_incluster: 172.18.0.1:11443
  after_installer_baremetalcluster: patch-to-registry-domain
control_plane_vip:
  global: 156.3.1.50
  workload: 156.3.1.95
workload:
  cluster_name: hcs-workloadcluster
  hostname_cp: hcs-workloadcluster-cp-1..3
  hostname_worker: hcs-workloadcluster-worker-1
  inventory_name: fill-after-elemental-register
core_package:
  installer_dir: /root/installer
  packtool: /root/installer/res/amd64/packtool
os:
  family: KubeOS
  id: alaudaos.k.25
  delivery_architecture: x86_64
  target_platform: linux/amd64
  source_tag: baremetal
  image_tag_base: alaudaos-feat-kubeos-provider-integration.ku.202609281026-0
  image_tag: alaudaos-feat-kubeos-provider-integration.ku.202609281026-0.x86_64
  rootfs_repository: tkestack/kubeos-rootfs
  iso_repository: tkestack/kubeos-iso
  catalog_key: v1.35.6-acp.1_amd64_alaudaos.k.25
providers:
  kubeadm_pack: cluster-api-provider-kubeadm.ALL.v1.0.14.tgz
  kubeadm_chart: v1.0.14
  baremetal_pack: cluster-api-provider-baremetal.ALL.v1.0.0-fix.51.7.g41764fd0-feat-kubeos-support.tgz
  baremetal_chart: v1.0.0-fix.51.7.g41764fd0-feat-kubeos-support
gates:
  seedimage: status.downloadURL-nonempty
  installer_json: POST-on-bootstrap-node-to-installer-pod-ip-8080
  packtool_auth: read-pack-push-help-first
  seedimage_pvc: default-StorageClass-20Gi
  registry_rewrite: not-loopback-not-kind-incluster
