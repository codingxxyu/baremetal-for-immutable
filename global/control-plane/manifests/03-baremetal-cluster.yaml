# APPLY-ON: bootstrap (minialauda)  — first create only
# Cluster and BaremetalCluster MUST be named exactly global.
# Default is External LB. For Internal Alive, set type: Internal and keep vrid.
# For External, delete the vrid field before apply.
#
# First apply: cpaas.io/registry-address is NODE_REGISTRY_ADDRESS 156.3.1.26:11443
# (physical nodes pull OS from the bootstrap registry during first install).
# Official installer rewrites Cluster / DCSCluster only — NOT BaremetalCluster.
# After installer Success, patch THIS object to REGISTRY_DOMAIN 156.3.1.50:11443
# (do not re-apply the whole file; a re-apply can wipe the live LB host).
# spec.controlPlaneLoadBalancer.host is 156.3.1.50 (TCP 6443 AND the platform VIP).
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalCluster
metadata:
  name: global
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: global
  annotations:
    cpaas.io/registry-address: 156.3.1.26:11443
spec:
  controlPlaneLoadBalancer:
    type: External
    host: 156.3.1.50
    port: 6443
    # vrid: <unique-vrid>
  networkType: kube-ovn
  networkDevice: eth0
