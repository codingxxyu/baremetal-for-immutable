# APPLY-ON: bootstrap (minialauda)  — first create only
# Site: PLATFORM_HOST = HOST_IP = 156.3.1.26, so NODE_REGISTRY_ADDRESS and
# REGISTRY_DOMAIN are the same host:11443. Installer rewrite of this Cluster
# annotation is a no-op on the host string. Do NOT re-apply after installer
# anyway (other fields / CIDRs must stay as reconciled).
# This is NOT 127.0.0.1 or 172.18.0.1 — those die when KIND is removed.
# BaremetalCluster is a different object; see 03-baremetal-cluster.yaml.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: global
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: global
    cluster-type: ProviderBaremetal
    is-global: "true"
  annotations:
    capi.cpaas.io/resource-group-version: infrastructure.cluster.x-k8s.io/v1beta1
    capi.cpaas.io/resource-kind: BaremetalCluster
    capi.cpaas.io/kubernetes: v1.35.6-acp.1
    cpaas.io/sentry-deploy-type: Baremetal
    cpaas.io/alb-address-type: ClusterAddress
    cpaas.io/kube-ovn-join-cidr: 100.64.0.0/16
    cpaas.io/kube-ovn-version: v4.4.6
    cpaas.io/registry-address: 156.3.1.26:11443
    cpaas.io/nodes-mode: self-managed
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.3.0.0/16
    services:
      cidrBlocks:
        - 10.4.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: BaremetalCluster
    name: global
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: global-kcp
