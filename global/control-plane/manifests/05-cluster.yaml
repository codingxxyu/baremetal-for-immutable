# APPLY-ON: bootstrap (minialauda)  — first create only
# First apply: NODE_REGISTRY_ADDRESS 156.3.1.26:11443 so Global CP nodes can
# pull OS from the bootstrap registry. Official installer rewrites THIS Cluster
# annotation to REGISTRY_DOMAIN 156.3.1.50:11443. Do NOT re-apply after installer
# (other live fields / CIDRs). BaremetalCluster is NOT rewritten — patch 03 after
# Success. Never 127.0.0.1 or 172.18.0.1.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: global
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: global
    cluster-type: ProviderBaremetal
    is-global: "true"
  annotations:
    capi.cpaas.io/resource-group-version: infrastructure.cluster.x-k8s.io/v1beta1
    capi.cpaas.io/resource-kind: BaremetalCluster
    capi.cpaas.io/kubernetes: v1.35.6-acp.1
    cpaas.io/sentry-deploy-type: Baremetal
    cpaas.io/alb-address-type: ClusterAddress
    cpaas.io/kube-ovn-join-cidr: 100.64.0.0/16
    cpaas.io/kube-ovn-version: v4.4.6
    cpaas.io/registry-address: 156.3.1.26:11443
    cpaas.io/nodes-mode: self-managed
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.3.0.0/16
    services:
      cidrBlocks:
        - 10.4.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: BaremetalCluster
    name: global
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: global-kcp
