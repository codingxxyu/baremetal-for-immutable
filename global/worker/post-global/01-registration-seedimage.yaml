# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Optional Global workers AFTER handoff. First delivery still skips workers.
# Do NOT apply ../manifests/ after KIND is gone — that SeedImage is 172.18.0.1:11443.
# Do not reuse the Global control-plane ISO.
# Gate: status.downloadURL. spec.size 20Gi needs default StorageClass on Global.
# elemental.server.url is already the platform host (management/02), ingress 443.
apiVersion: elemental.cattle.io/v1beta1
kind: MachineRegistration
metadata:
  name: global-worker-registration
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    cpaas.io/cluster-name: global
spec:
  machineName: "global-worker-${System Information/UUID}"
  machineInventoryLabels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    pool.baremetal.alauda.io/eligible: "true"
    elemental.cattle.io/serial-number: "${System Information/Serial Number}"
    cpaas.io/cluster-name: global
  machineInventoryAnnotations:
    elemental.cattle.io/machine-uuid: "${System Information/UUID}"
  config:
    elemental:
      install:
        device: /dev/elemental-install-target
        eject-cd: true
        reboot: true
        snapshotter:
          type: btrfs
          maxSnaps: 4
      registration:
        emulate-tpm: true
        emulated-tpm-seed: -1
---
apiVersion: elemental.cattle.io/v1beta1
kind: SeedImage
metadata:
  name: global-worker-registration-iso
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    cpaas.io/cluster-name: global
spec:
  type: iso
  baseImage: 156.3.1.50:11443/tkestack/baremetal-base-image-iso:<os-image-tag>
  registrationRef:
    apiVersion: elemental.cattle.io/v1beta1
    kind: MachineRegistration
    name: global-worker-registration
    namespace: cpaas-system
  targetPlatform: linux/amd64
  size: 20Gi
  cleanupAfterMinutes: 120
  cloud-config:
    stages:
      boot:
        - name: "Size COS_STATE for reprovisioning"
          files:
            - path: /etc/elemental/config.d/partitions.yaml
              permissions: 0644
              content: |
                install:
                  partitions:
                    state:
                      size: 20480
