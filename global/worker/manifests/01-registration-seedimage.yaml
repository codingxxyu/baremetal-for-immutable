# DO-NOT-APPLY on first delivery. See ../SKIP.md.
# APPLY-ON: bootstrap (minialauda) — only if a later CR forces bootstrap-phase Global workers.
# Optional Global workers.
# First delivery: skip this directory. Install three control-plane hosts only.
# Gate: status.downloadURL. spec.size 20Gi needs default StorageClass.
# Do not reuse the control-plane ISO.
# Apply on bootstrap only if those workers must exist before installer/handoff;
# then add their inventory names and this Registration to 04-dcs-import-extra-resources.yaml.
# After handoff, do not use this bootstrap ISO. Change baseImage to
#   156.3.1.50:11443/tkestack/kubeos-iso:alaudaos-feat-kubeos-provider-integration.ku.202609281026-0.x86_64
# and apply on the finished Global instead.
# Do not reuse the control-plane ISO.
apiVersion: elemental.cattle.io/v1beta1
kind: MachineRegistration
metadata:
  name: global-worker-registration
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    cpaas.io/cluster-name: global
spec:
  machineName: "global-worker-${System Information/UUID}"
  machineInventoryLabels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    pool.baremetal.alauda.io/eligible: "true"
    elemental.cattle.io/serial-number: "${System Information/Serial Number}"
    cpaas.io/cluster-name: global
    os.baremetal.alauda.io/id: alaudaos.k.25
    os.baremetal.alauda.io/arch: "${Runtime/Architecture}"
  machineInventoryAnnotations:
    elemental.cattle.io/machine-uuid: "${System Information/UUID}"
  config:
    elemental:
      install:
        device: /dev/elemental-install-target
        system-uri: 156.3.1.26:11443/tkestack/kubeos-rootfs:alaudaos-feat-kubeos-provider-integration.ku.202609281026-0.x86_64
        eject-cd: true
        reboot: true
      registration:
        emulate-tpm: true
        emulated-tpm-seed: -1
---
apiVersion: elemental.cattle.io/v1beta1
kind: SeedImage
metadata:
  name: global-worker-registration-iso
  namespace: cpaas-system
  labels:
    app.kubernetes.io/part-of: cluster-api-provider-baremetal
    cpaas.io/cluster-name: global
spec:
  type: iso
  baseImage: 172.18.0.1:11443/tkestack/kubeos-iso:alaudaos-feat-kubeos-provider-integration.ku.202609281026-0.x86_64
  registrationRef:
    apiVersion: elemental.cattle.io/v1beta1
    kind: MachineRegistration
    name: global-worker-registration
    namespace: cpaas-system
  targetPlatform: linux/amd64
  size: 20Gi
  cleanupAfterMinutes: 120