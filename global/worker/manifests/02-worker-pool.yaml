# DO-NOT-APPLY on first delivery. See ../SKIP.md.
# APPLY-ON: bootstrap (minialauda) — only if a later CR forces bootstrap-phase Global workers.
# Apply after global worker hosts have left Live ISO and are Ready=True.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: global-worker-pool
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: global
spec:
  clusterName: global
  machineInventories:
    - name: <global-worker-inventory-1>
      hostname: global-worker-1
      networkDevice: eth0
