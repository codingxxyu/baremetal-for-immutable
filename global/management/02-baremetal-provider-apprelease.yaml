# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Do NOT apply on minialauda. Do NOT import bootstrap dex.tls.
#
# installer console.cert.selfSigned produces dex.tls with tls.crt + tls.key only.
# elemental-operator fails if caCertSecretKey is still ca.crt:
#   MountVolume.SetUp failed ... non-existent secret key: ca.crt
# Confirm keys first:
#   kubectl --kubeconfig global-kubeconfig -n cpaas-system get secret dex.tls -o jsonpath='{.data}'
# If the Secret has ca.crt (cert-manager), change the key below back to ca.crt.
#
# After this file, new Registration / ISO use the platform domain, not the bootstrap node.
apiVersion: operator.alauda.io/v1alpha1
kind: AppRelease
metadata:
  annotations:
    auto-recycle: "true"
    interval-sync: "true"
  name: cluster-api-provider-baremetal
  namespace: cpaas-system
spec:
  destination:
    cluster: ""
    namespace: ""
  source:
    charts:
      - name: ait/chart-cluster-api-provider-baremetal
        releaseName: cluster-api-provider-baremetal
        targetRevision: <baremetal-provider-chart-version>
        repoURL: 156.3.1.26:11443
    timeout: 120
    values:
      global:
        albName: global-alb2
        auth:
          default_admin: admin@cpaas.io
        cluster:
          isGlobal: true
          name: global
          networkType: kube-ovn
          type: Baremetal
        host: 156.3.1.26
        ingress:
          ingressClassName: global-alb2
          tls:
            secretName: dex.tls
        labelBaseDomain: cpaas.io
        namespace: cpaas-system
        platformUrl: https://156.3.1.26
        region: global
        registry:
          address: 156.3.1.26:11443
        replicas: 1
        scheme: https
      provider:
        imageCatalog:
          images:
            v1.35.6-acp.1:
              repository: tkestack/baremetal-base-image
              tag: <os-image-tag>
      elemental:
        server:
          url: https://156.3.1.26
        systemAgent:
          authMode: shared
          splitAuthEnabled: false
          serviceAccountName: baremetal-system-agent
          globalServiceAccountName: baremetal-global-system-agent
          sharedAuthReadOnly: false
        tls:
          agentTLSMode: strict
          caCertSecretName: dex.tls
          caCertSecretKey: tls.crt
