# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Apply after workload worker hosts have left Live ISO and are Ready=True.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: hcs-workloadcluster-worker-pool
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: hcs-workloadcluster
spec:
  clusterName: hcs-workloadcluster
  machineInventories:
    - name: <workload-worker-inventory-1>
      hostname: hcs-workloadcluster-worker-1
      networkDevice: eth0
