# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: hcs-workloadcluster-worker-deployment
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: hcs-workloadcluster
spec:
  clusterName: hcs-workloadcluster
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: hcs-workloadcluster-worker-deployment
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: hcs-workloadcluster-worker-deployment
        cluster.x-k8s.io/cluster-name: hcs-workloadcluster
        pool.name: hcs-workloadcluster-workers
    spec:
      clusterName: hcs-workloadcluster
      version: v1.35.6-acp.1
      nodeDrainTimeout: 5m
      nodeVolumeDetachTimeout: 5m
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: hcs-workloadcluster-worker-kubeadm-config
          namespace: cpaas-system
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: BaremetalMachineTemplate
        name: hcs-workloadcluster-worker-template
        namespace: cpaas-system
