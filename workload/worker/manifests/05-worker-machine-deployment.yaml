# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: <workload-cluster-name>-worker-deployment
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <workload-cluster-name>
spec:
  clusterName: <workload-cluster-name>
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: <workload-cluster-name>-worker-deployment
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: <workload-cluster-name>-worker-deployment
        cluster.x-k8s.io/cluster-name: <workload-cluster-name>
        pool.name: <workload-cluster-name>-workers
    spec:
      clusterName: <workload-cluster-name>
      version: v1.35.6-acp.1
      nodeDrainTimeout: 5m
      nodeVolumeDetachTimeout: 5m
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: <workload-cluster-name>-worker-kubeadm-config
          namespace: cpaas-system
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: BaremetalMachineTemplate
        name: <workload-cluster-name>-worker-template
        namespace: cpaas-system
