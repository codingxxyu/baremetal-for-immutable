# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# cpaas.io/registry-address is the platform registry, never 156.3.1.26.
# KIND is gone by the time this Cluster is created.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: <workload-cluster-name>
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <workload-cluster-name>
    cluster-type: ProviderBaremetal
  annotations:
    capi.cpaas.io/resource-group-version: infrastructure.cluster.x-k8s.io/v1beta1
    capi.cpaas.io/resource-kind: BaremetalCluster
    capi.cpaas.io/kubernetes: v1.35.6-acp.1
    cpaas.io/sentry-deploy-type: Baremetal
    cpaas.io/alb-address-type: ClusterAddress
    cpaas.io/kube-ovn-join-cidr: 100.65.0.0/16
    cpaas.io/kube-ovn-version: v4.4.6
    cpaas.io/registry-address: <platform-access-domain-or-vip>:11443
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.5.0.0/16
    services:
      cidrBlocks:
        - 10.6.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: BaremetalCluster
    name: <workload-cluster-name>
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: <workload-cluster-name>-control-plane
