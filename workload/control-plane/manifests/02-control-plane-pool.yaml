# Apply only after three workload control-plane hosts have left Live ISO
# and MachineInventory is Ready=True. Fill names from elemental-register.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: <workload-cluster-name>-control-plane-pool
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <workload-cluster-name>
spec:
  clusterName: <workload-cluster-name>
  machineInventories:
    - name: <workload-cp-inventory-1>
      hostname: <workload-cluster-name>-cp-1
      networkDevice: eth0
    - name: <workload-cp-inventory-2>
      hostname: <workload-cluster-name>-cp-2
      networkDevice: eth0
    - name: <workload-cp-inventory-3>
      hostname: <workload-cluster-name>-cp-3
      networkDevice: eth0
