# APPLY-ON: finished Global   kubeconfig: global-kubeconfig
# Default is External LB. For Internal Alive, set type: Internal and keep vrid.
# For External, delete the vrid field before apply.
# networkDevice is the CNI NIC. Override a single host on the pool instead.
# cpaas.io/registry-address is PLATFORM_HOST:11443 (this site: 156.3.1.26:11443).
# Never 127.0.0.1 / 172.18.0.1. LB host is the Workload API VIP (TCP 6443), not :11443.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalCluster
metadata:
  name: <workload-cluster-name>
  namespace: cpaas-system
  labels:
    cpaas.io/cluster-name: <workload-cluster-name>
  annotations:
    cpaas.io/registry-address: 156.3.1.26:11443
spec:
  controlPlaneLoadBalancer:
    type: External
    host: 156.3.1.95
    port: 6443
    # vrid: <workload-vrid>
  networkType: kube-ovn
  networkDevice: eth0
